[project]
name = "concrete-arbitrary-gap"
version = "1.0.0"
description = "Reproducibility package for the concrete-arbitrary kinship inference study"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
